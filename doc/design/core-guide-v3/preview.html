<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>core_guide · 新展示方向</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9ecef;color:#20252c;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}header.board{padding:28px 40px 22px;display:flex;justify-content:space-between;align-items:end}h1{font-size:23px;font-weight:600;margin:0 0 8px}header p{font-size:13px;color:#6e7682;margin:0}.stage{display:flex;gap:32px;padding:0 40px 36px;align-items:start}.label{font-size:12px;letter-spacing:.1em;color:#747d89;margin:0 0 12px}.phone{width:360px;height:780px;background:#f7f8fa;border-radius:26px;overflow:hidden;box-shadow:0 12px 40px #25304615;position:relative;border:1px solid #dce1e6}.status{height:32px;padding:10px 22px 0;font-size:11px;font-weight:600;display:flex;justify-content:space-between}.bar{height:58px;display:flex;align-items:center;gap:16px;padding:0 20px;font-size:17px;font-weight:600}.back{font-size:24px;font-weight:400}.content{padding:12px 20px}.intro{font-size:13px;color:#7a838f;margin:0 0 20px;line-height:1.7}.preview{background:white;border:1px solid #e8ebef;border-radius:16px;padding:20px;margin-bottom:26px}.eyebrow{font-size:11px;color:#929ba6;letter-spacing:.08em}.preview-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:12px}.preview-title{font-size:16px;font-weight:600;margin-bottom:6px}.hint{font-size:12px;color:#89929e}.try{background:#3168bf;color:white;border:0;border-radius:10px;height:44px;padding:0 17px;font-size:13px;font-weight:600;white-space:nowrap}.section{font-size:12px;color:#7b8592;display:flex;justify-content:space-between;margin:0 4px 9px}.list{background:white;border-radius:16px;border:1px solid #e8ebef;padding:0 14px}.row{height:62px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #eef0f3}.row:last-child{border:0}.icon{width:32px;height:32px;border-radius:9px;background:#f3f5f8;display:grid;place-items:center;color:#697687}.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.row-title{font-size:13px;font-weight:500;margin-bottom:5px}.row-desc{font-size:11px;color:#8a929d}.chev{margin-left:auto;color:#b0b6bf;font-size:19px}.note{color:#949ca7;font-size:11px;line-height:1.6;margin:15px 4px 0}.gesture{position:absolute;bottom:9px;width:100px;height:4px;border-radius:9px;background:#20252c;left:130px;opacity:.8}.dim{position:absolute;inset:0;background:#151b252b}.anchor{position:absolute;left:243px;top:185px;width:77px;height:44px;border:0;border-radius:10px;box-shadow:0 0 0 4px #f7f8fa,0 0 0 5px #6596e1;background:#3168bf;color:white;font-weight:600;font-size:13px}.tip{position:absolute;top:249px;left:62px;width:272px;background:#252b34;color:#f6f8fb;border-radius:14px;padding:16px 18px 8px;box-shadow:0 8px 24px #141b2525}.tip-head{display:flex;gap:10px;align-items:baseline}.tip-title{font-size:15px;font-weight:600;letter-spacing:.01em}.count{font-size:11px;color:#a5afbe;margin-left:auto}.tip p{font-size:13px;color:#c1c8d3;line-height:1.65;margin:8px 0 7px}.tip-footer{display:flex;align-items:center;justify-content:space-between;height:40px}.skip{color:#aab4c3;font-size:12px}.next{color:#a6c8ff;font-size:13px;font-weight:600}.dark{background:#171b21;color:#eef1f5}.dark .preview,.dark .list{background:#21262d;border-color:#30363f}.dark .icon{background:#2a313b;color:#aab5c5}.dark .row{border-color:#30363f}.dark .tip{background:#f7f9fc;color:#222a35}.dark .tip p{color:#586579}.dark .tip .count,.dark .tip .skip{color:#778291}.dark .tip .next{color:#3168bf}.dark .dim{background:#0004}.dark .anchor{box-shadow:0 0 0 4px #171b21,0 0 0 5px #8daee0}.dark .gesture{background:#c6cdd8}.sub{font-size:11px;color:#8d97a4;margin-top:12px;max-width:360px;line-height:1.7}button{cursor:pointer}
</style><header class="board"><div><h1>轻提示，留住页面本身。</h1><p>演示页与引导浮层一起重做 · 同一方案的普通、引导与深色状态</p></div><p>设计预览 · 非 Android 实机截图</p></header><main class="stage" id="stage"></main>
<script>
const paths=['<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M14 6h4a2 2 0 0 1 2 2v3M4 14v4a2 2 0 0 0 2 2h4"/>','<path d="M5 5h14M5 10h14M5 15h10M5 20h7"/>','<path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/>','<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>','<path d="M13 3 5 14h7l-1 7 8-11h-7l1-7"/>','<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M7 6.5h.01"/>'];
const items=[['分步引导','前进、返回与跳过'],['长文本','中英文换行与滚动'],['深色样式','对比色与目标强调'],['全屏模式','系统栏隐藏和恢复'],['关闭动画','安静地显示提示'],['弹窗内引导','独立窗口中的定位']];
function screen(dark,active){return '<div class="phone '+(dark?'dark':'')+'"><div class="status"><span>9:41</span><span>◔ ▰</span></div><div class="bar"><span class="back">‹</span>功能引导</div><div class="content"><p class="intro">在真实控件上，试试一条轻提示。</p><section class="preview"><div class="eyebrow">交互预览</div><div class="preview-row"><div><div class="preview-title">一个目标，一条提示</div><div class="hint">说明跟随控件，而不是占满屏幕</div></div><button class="try">试一下</button></div></section><div class="section"><span>演示场景</span><span>6 种</span></div><div class="list">'+items.map((a,i)=>'<div class="row"><div class="icon"><svg viewBox="0 0 24 24">'+paths[i]+'</svg></div><div><div class="row-title">'+a[0]+'</div><div class="row-desc">'+a[1]+'</div></div><span class="chev">›</span></div>').join('')+'</div><div class="note">提示不会修改系统设置。随时可以跳过。</div></div><div class="gesture"></div>'+(active?'<div class="dim"></div><button class="anchor">试一下</button><section class="tip"><div class="tip-head"><span class="tip-title">从这里开始</span><span class="count">1 / 2</span></div><p>一条提示只解释当前操作。<br>你可以随时跳过，之后再查看。</p><div class="tip-footer"><span class="skip">跳过</span><span class="next">下一步&nbsp; ›</span></div></section>':'')+'</div>'}
document.getElementById('stage').innerHTML=[['演示页',false,false],['操作提示',false,true],['深色环境',true,true]].map(([label,dark,active])=>'<section><div class="label">'+label+'</div>'+screen(dark,active)+'<p class="sub">'+(active?'紧贴目标 · 对比色提示 · 轻操作区 · 48dp 触控区域':'保留六个真实入口，去掉按钮墙和无关结果占位。')+'</p></section>').join('');
document.querySelectorAll('.try').forEach(b=>b.onclick=()=>{const p=b.closest('.phone');if(!p.querySelector('.tip'))p.insertAdjacentHTML('beforeend','<div class="dim"></div><section class="tip"><div class="tip-head"><span class="tip-title">从这里开始</span><span class="count">1 / 2</span></div><p>一条提示只解释当前操作。<br>随时可以跳过。</p><div class="tip-footer"><span class="skip">跳过</span><span class="next">下一步 ›</span></div></section>')});
document.addEventListener('click',e=>{if(e.target.classList.contains('skip')){const p=e.target.closest('.phone');p.querySelectorAll('.dim,.tip,.anchor').forEach(x=>x.remove())}if(e.target.classList.contains('next')){const tip=e.target.closest('.tip');tip.querySelector('.count').textContent='2 / 2';tip.querySelector('.tip-title').textContent='随时结束';tip.querySelector('p').textContent='可以回看上一步，或直接结束本次引导。';e.target.textContent='完成'}});
</script></html>
