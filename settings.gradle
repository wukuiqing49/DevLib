pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    versionCatalogs {
        integrationLibs { from(files('gradle/catalogs/integrationLibs.versions.toml')) }
        baseLibs { from(files('gradle/catalogs/baseLibs.versions.toml')) }
        utilLibs { from(files('gradle/catalogs/utilLibs.versions.toml')) }
        netLibs { from(files('gradle/catalogs/netLibs.versions.toml')) }
        routerLibs { from(files('gradle/catalogs/routerLibs.versions.toml')) }
        dropLibs { from(files('gradle/catalogs/dropLibs.versions.toml')) }
        pressLibs { from(files('gradle/catalogs/pressLibs.versions.toml')) }
        roofLibs { from(files('gradle/catalogs/roofLibs.versions.toml')) }
        nasLibs { from(files('gradle/catalogs/nasLibs.versions.toml')) }
        photoLibs { from(files('gradle/catalogs/photoLibs.versions.toml')) }
        siteLibs { from(files('gradle/catalogs/siteLibs.versions.toml')) }
        beautyLibs { from(files('gradle/catalogs/beautyLibs.versions.toml')) }
        crashLibs { from(files('gradle/catalogs/crashLibs.versions.toml')) }
    }
    repositories {
        google()
        mavenCentral()
        maven { url = uri('https://jitpack.io') }
        maven { url = uri('https://maven.aliyun.com/repository/public') }
        maven { url = uri('https://maven.aliyun.com/repository/google') }
    }
}

