# DropLAN core_google 当前启用依赖快照；不包含广告、Analytics 或商业后台。
[libraries]
firebase-bom = { module = "com.google.firebase:firebase-bom", version = "34.0.0" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
credentials = { module = "androidx.credentials:credentials", version = "1.5.0" }
credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version = "1.5.0" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version = "1.1.1" }
gson = { module = "com.google.code.gson:gson", version = "2.13.1" }
coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version = "1.10.2" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.10.2" }
billing = { module = "com.android.billingclient:billing", version = "8.3.0" }
junit = { module = "junit:junit", version = "4.13.2" }
