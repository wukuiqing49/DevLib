schemaVersion: 1
project:
  name: DevLib
  description: Android 多模块独立功能库与开发者工作台，统一维护基础框架、文件传输、轻量图片、元数据与文档导出
  kind: development-library
  lifecycle: initialized
  phase: integration-validation
android:
  applicationId: com.wkq.dev
  namespace: com.wkq.dev
  versionName: 0.1.0
  minSdk: 26
  compileSdk: 37
  targetSdk: 37
  jvmTarget: 17
  requiredHostLocales: [en]
  language: kotlin
  uiToolkit: xml
  viewBinding: true
modules:
  app: app
  coreBase: core/core_base
  coreUtils: core/core_utils
  featureApp: feature/feature_app
  featureRes: feature/feature_res
  demoCommon: feature/feature_demo_common
  demoFoundation: feature/feature_demo_foundation
  demoFiles: feature/feature_demo_files
  demoImage: feature/feature_demo_image
  demoDocument: feature/feature_demo_document
  demoGoogle: feature/feature_demo_google
  libraries:
  - core/core_google
  - core/core_archive
  - core/core_base
  - core/core_image_render
  - core/core_network
  - core/core_pdf
  - core/core_qrcode
  - core/core_router_annotation
  - core/core_router_api
  - core/core_router_gradle_plugin
  - core/core_router_processor
  - core/core_utils
  - core/lib_document
  - core/lib_drop
  - core/lib_metadata
  - core/lib_operations
  - core/core_nas
  - core/core_usb
  - core/lib_upload
  - core/lib_xpopup
  foundationLibraries:
  - core/core_base
  - core/core_network
  - core/core_router_annotation
  - core/core_router_api
  - core/core_router_gradle_plugin
  - core/core_router_processor
  - core/core_utils
  - core/lib_xpopup
excludedSources:
- Starxen
- BeautySDK
- DevHub
sourceOfTruth:
  agentEntry: AGENTS.md
  capabilityIndex: .agents/INDEX.md
  dependencyVersions: gradle/libs.versions.toml
  gradleWrapper: gradle/wrapper/gradle-wrapper.properties
  moduleGraph: settings.gradle
  moduleBuildFiles: '**/build.gradle'
  importManifest: docs/import-manifest.json
executionPolicy:
  deviceCommands: excluded
  deviceReason: 用户明确要求不做真机测试；执行 adb 前先检查本项，后续明确授权可覆盖
  skillSource: project-local-first
validation:
  androidWorkflows: python -B .agents/scripts/validate_android_workflows.py --project-root . --skip-figma
  androidWorkflowTests: python -B .agents/scripts/tests/test_validate_android_workflows.py -v
  agentStructure: python -B .agents/scripts/validate_agent_structure.py --project-root
    .
  agentConfiguration: python -B .agents/scripts/validate_android_workflows.py --project-root
    . --config-only
  agentTests: python -B .agents/scripts/tests/test_validate_agent_structure.py -v
  debugBuild: .\gradlew.bat :app:assembleDebug
  libraryBuild: .\gradlew.bat assembleLibraries
  libraryTests: .\gradlew.bat testLibraries
agentFiles:
  rules:
  - droplan.md
  workflows:
  - audit-droplan.md
  prompts:
  - audit-droplan.md
capabilities:
  available:
  - android-workflows
  - android-scaffold
  - figma-android
  - zeplin-android
  - google-play-assets
  extensionPolicy: 按实际需求新增技术方向，不声明未实现的能力
examples:
  androidScaffold: .agents/config/project-scaffold.yml
  status: 当前 DevLib 演示工程基线；独立库保留迁入 API 包名，由中央依赖快照和模块构建文件维护
