plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    id 'maven-publish'
}

ext.POM_ARTIFACT_ID = "AndroidCoreUtils"
ext.POM_NAME = "core_util"
ext.POM_DESCRIPTION = "Android utility library for storage, image loading, files, permissions, documents, network, jump handling, logs, screen, notification and safety helpers."

android {
    namespace = 'com.wkq.util'
    compileSdk appConfig.compileSdk

    defaultConfig {
        minSdk 23

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
    }

    
}

kotlin {
    compilerOptions {
        jvmTarget = appConfig.jvmTarget
        freeCompilerArgs.addAll(["-Xskip-metadata-version-check"])
    }
}

dependencies {
    implementation utilLibs.androidx.core.ktx
    implementation utilLibs.androidx.appcompat
    implementation utilLibs.androidx.activity.ktx
    implementation utilLibs.androidx.fragment.ktx
    implementation utilLibs.kotlinx.coroutines.android

    testImplementation utilLibs.junit

    implementation utilLibs.toasty
    api utilLibs.mmkv
    api utilLibs.coil
    implementation utilLibs.coil3.coil.gif
    implementation(utilLibs.coil.network.okhttp)
}




apply from: rootProject.file("gradle/library-publish.gradle")
