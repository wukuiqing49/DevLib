plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}
android {
    namespace = 'com.wkq.google'
    compileSdk = libs.versions.compileSdk.get().toInteger()
    defaultConfig { minSdk = 26; consumerProguardFiles 'consumer-rules.pro' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.all { maxHeapSize = '192m'; jvmArgs '-XX:ActiveProcessorCount=2' } }
}
dependencies {
    api platform(googleLibs.firebase.bom)
    api googleLibs.firebase.auth
    implementation googleLibs.credentials
    implementation googleLibs.credentials.play.services
    implementation googleLibs.googleid
    implementation googleLibs.gson
    implementation googleLibs.coroutines.play.services
    implementation googleLibs.billing
    implementation googleLibs.coroutines.core
    testImplementation googleLibs.junit
}
apply from: rootProject.file('gradle/library-publish.gradle')
