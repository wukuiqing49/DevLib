plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    id 'maven-publish'
}

android {
    namespace = 'com.wkq.base'
    compileSdk appConfig.compileSdk

    defaultConfig {
        minSdk 23

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }

    buildFeatures {
        viewBinding = true
    }
    
}

kotlin {
    compilerOptions {
        jvmTarget = appConfig.jvmTarget
    }
}

dependencies {
    api(baseLibs.androidx.core.ktx)
    api(baseLibs.androidx.appcompat)
    api(baseLibs.androidx.lifecycle.viewmodel)
    api(baseLibs.androidx.lifecycle.livedata.core)
    api(baseLibs.androidx.fragment)
    api(baseLibs.androidx.recyclerview)
    api(baseLibs.androidx.viewpager2)
    api(baseLibs.androidx.activity)
    api(baseLibs.androidx.constraintlayout)
    api(baseLibs.smartrefresh.layout.kernel)
    api project(':core:lib_xpopup')
    implementation(baseLibs.smartrefresh.header.classics)
    
    testImplementation integrationLibs.junit
    testImplementation integrationLibs.robolectric
}


apply from: rootProject.file("gradle/library-publish.gradle")
