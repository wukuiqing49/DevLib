plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace = 'com.lxj.xpopup'
    compileSdk 36

    defaultConfig {
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        abortOnError = true
    }

    
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    testImplementation integrationLibs.junit
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    api integrationLibs.kotlin.stdlib
    implementation integrationLibs.exifinterface
    implementation integrationLibs.core
    implementation integrationLibs.androidx.appcompat.appcompat
    implementation integrationLibs.androidx.recyclerview.recyclerview
    implementation integrationLibs.transition
    implementation integrationLibs.viewpager2
}

afterEvaluate {
    
}

apply from: rootProject.file("gradle/library-publish.gradle")
