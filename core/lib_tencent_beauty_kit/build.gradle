apply plugin: 'com.android.library'

android {
    compileSdk rootProject.ext.compileSdkVersion
    namespace 'com.tencent.effect.beautykit'
    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ['*.aar'])

    implementation integrationLibs.com.google.code.gson.gson
    implementation integrationLibs.okhttp

    implementation integrationLibs.glide
    implementation integrationLibs.gifdecoder
    implementation integrationLibs.disklrucache

    implementation integrationLibs.appcompat
    implementation integrationLibs.constraintlayout
    implementation integrationLibs.recyclerview
//    api integrationLibs.tencenteffect.s1.v03.customize
    api integrationLibs.tencenteffect.a1.v03

}

gradle.projectsEvaluated {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-parameters"
    }
}
apply from: rootProject.file("gradle/library-publish.gradle")
