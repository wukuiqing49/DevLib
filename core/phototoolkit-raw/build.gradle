plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}

def rawPrebuilt = file('prebuilt')
def rawJniLibs = file('src/main/jniLibs')
def engineJniLibs = file('../phototoolkit-engine/src/main/jniLibs')

android {
    namespace = 'com.phototoolkit.raw'
    compileSdk = photoLibs.versions.compileSdk.get().toInteger()
    ndkVersion = photoLibs.versions.ndk.get()

    defaultConfig {
        minSdk = photoLibs.versions.minSdk.get().toInteger()
        targetSdk = photoLibs.versions.targetSdk.get().toInteger()
        consumerProguardFiles = ['consumer-rules.pro']
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments "-DRAWSDK_ROOT=${rawPrebuilt.absolutePath.replace('\\', '/')}",
                        "-DRAW_JNI_ROOT=${rawJniLibs.absolutePath.replace('\\', '/')}",
                        "-DENGINE_JNI_ROOT=${engineJniLibs.absolutePath.replace('\\', '/')}",
                        "-DVIPSSDK_ROOT=${file('../phototoolkit-engine/prebuilt').absolutePath.replace('\\', '/')}"
            }
        }
    }

    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt') }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    api project(':core:phototoolkit-engine')
    api project(':core:lib_operations')

    testImplementation photoLibs.junit
    testImplementation photoLibs.robolectric
}

apply from: rootProject.file("gradle/library-publish.gradle")
