plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace = 'com.wkq.photo.qrcode'
    compileSdk = photoLibs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk = photoLibs.versions.minSdk.get().toInteger()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    api project(':core:lib_operations')
    implementation photoLibs.androidx.appcompat
    api photoLibs.zxing.lite

    testImplementation photoLibs.junit
    testImplementation photoLibs.robolectric
}

apply from: rootProject.file("gradle/library-publish.gradle")
